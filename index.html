<style>
:root{--acc:#ea580c;--acc-d:#c2410c;--fg:#0f172a;--mut:#64748b;--line:#e2e8f0;--soft:#f1f5f9;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--fg);font-family:Heebo,system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:28px 22px 48px;display:flex;flex-direction:column;gap:24px}
[hidden]{display:none!important}
h1{font-size:30px;font-weight:800;margin:0;line-height:1.2}
h2{font-size:17px;font-weight:700;margin:0}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.lead{font-size:16px;line-height:1.6;color:#334155;margin:0}
.steps{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.steps li{display:flex;gap:12px;align-items:center;font-size:15px}
.steps b{flex:none;width:30px;height:30px;border-radius:50%;background:#ffedd5;color:var(--acc-d);display:flex;align-items:center;justify-content:center;font-size:14px}
.drop{border:2px dashed #fdba74;border-radius:20px;padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;background:#fff7ed}
.drop.over{background:#ffedd5;border-color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;background:var(--acc);color:#fff;font:inherit;font-size:15px;font-weight:700;border-radius:999px;padding:13px 24px;min-height:46px;cursor:pointer}
.btn:focus-within,.btn:focus-visible,.tab:focus-visible,.ghost:focus-visible{outline:3px solid #fdba74;outline-offset:2px}
.btn{position:relative;overflow:hidden}
.btn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.ghost{border:1px solid var(--line);background:#fff;color:var(--fg);font:inherit;font-size:13px;border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer}
.note{font-size:13px;color:var(--mut);line-height:1.6;margin:0}
.err{background:#fef2f2;color:var(--bad);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}

.tab{flex:1;border:0;background:none;font:inherit;font-size:15px;color:var(--mut);padding:12px 2px;min-height:46px;cursor:pointer;border-bottom:3px solid transparent}
.tab[aria-pressed=true]{color:var(--fg);font-weight:700;border-bottom-color:var(--acc)}
.sec{display:flex;flex-direction:column;gap:24px}
.lbl{font-size:14px;color:var(--mut)}
.big{font-size:52px;font-weight:800;letter-spacing:-1px;line-height:1.05;font-variant-numeric:tabular-nums}
.sub{font-size:14px}
.cols{display:flex;align-items:flex-end;gap:10px;height:124px;border-bottom:1px solid var(--line)}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.col span{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.col i{display:block;width:100%;border-radius:6px 6px 0 0}
.mon{display:flex;gap:10px;margin-top:8px}
.mon span{flex:1;min-width:0;text-align:center;font-size:12px;color:#475569;overflow:hidden;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-direction:column;gap:6px}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15px}
.line b{font-variant-numeric:tabular-nums;white-space:nowrap}
.line small{color:var(--mut);font-size:12px}
.track{height:6px;background:var(--soft);border-radius:3px}

.tx{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--soft)}

      .acts{display:flex;gap:8px}

<body>
<main class="wrap" id="start">
  <h1>לאן הכסף שלכם הולך?</h1>
  <p class="lead">בואו נבין לאן הכסף הולך, איפה אפשר לחסוך, ואיפה להשקיע אותו</p>
  <div class="drop" id="drop">
    <label class="btn">בחירת קובץ אקסל<input type="file" id="file" multiple accept=".xlsx,.xls,.csv" aria-label="בחירת קובץ אקסל"></label>
  </div>
  <div class="err" id="err" role="alert" hidden></div>
  <button type="button" class="ghost" id="install" hidden>הוספה למסך הבית</button>
</main>

<main class="wrap" id="app" hidden>
  <div class="top"><span class="mut" id="period"></span><span class="acts"><label class="ghost">הוספת קובץ<input type="file" id="file2" multiple accept=".xlsx,.xls,.csv" aria-label="הוספת קובץ"></label><button type="button" class="ghost" id="reset">מחיקה</button></span></div>
  <div class="info" id="err2" role="status" hidden></div>
  <nav class="nav" aria-label="לשוניות">
    <button type="button" class="tab" data-tab="overview" aria-pressed="true">סקירה</button>
    <button type="button" class="tab" data-tab="categories" aria-pressed="false">קטגוריות</button>
    <button type="button" class="tab" data-tab="subs" aria-pressed="false">מנויים</button>
    <button type="button" class="tab" data-tab="savings" aria-pressed="false">חיסכון</button>
  </nav>

  <section class="sec" id="overview">
    <div><div class="lbl">ממוצע הוצאות בחודש</div><div class="big" id="avg"></div><div class="sub" id="lastline"></div></div>
    <div><div class="pick" id="pick"></div><div class="chart" id="chart"><div class="cols2" id="cols"></div></div></div>
    <div class="list"><h2>לאן הכסף הולך</h2><div class="list" id="top4"></div></div>
    <div class="card"><div><div class="lbl">אפשר לחסוך בשנה</div><div class="n ok" id="save1"></div></div><button type="button" class="btn" data-tab="savings">להמלצות</button></div>
  </section>

  <section class="sec" id="categories" hidden>
    <div><div class="lbl" id="totlbl"></div><div class="big" id="total"></div></div>

  <section class="sec" id="subs" hidden>
    <div><div class="lbl">חיובים קבועים בחודש</div><div class="big" id="submonth"></div><div class="sub mut" id="subyear"></div></div>
    <div id="sublist"></div>
  </section>

  <section class="sec" id="savings" hidden>
    <div><div class="lbl">אפשר לחסוך בשנה</div><div class="big ok" id="save2"></div></div>
    <div id="savlist"></div>
    <details class="fold" id="dupfold"><summary><span id="duptitle">חיובים כפולים</span><span class="x">הצגה</span></summary><div id="duplist"></div></details>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const ils = (v) => '₪' + Math.round(v).toLocaleString('en-US');
const ils2 = (v) => '₪' + (Math.round(v * 100) / 100).toLocaleString('en-US', { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 });
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const ml = (m) => MONTHS[+m.slice(5, 7) - 1];
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const CAT_MAP = { 'מזון וצריכה': 'סופר ומזון', 'מסעדות, קפה וברים': 'מסעדות וקפה', 'דלק, חשמל וגז': 'דלק ורכב', 'תחבורה ורכבים': 'דלק ורכב', 'קוסמטיקה וטיפוח': 'טיפוח', 'עיצוב הבית': 'בית', 'פנאי, בידור וספורט': 'פנאי', 'טיסות ותיירות': 'נסיעות לחו״ל', 'רפואה ובתי מרקחת': 'בריאות', 'מוצרי m_a_x': 'עמלות', 'שירותי תקשורת': 'מנויים ותקשורת', 'העברת כספים': 'העברות' };
const RE_SUBS = /PATREON|GOOGLE|APPLE\.COM|NETFLIX|SPOTIFY|YOUTUBE|DISNEY|OPENAI|CHATGPT|ANTHROPIC|ICLOUD|MICROSOFT|ADOBE|DROPBOX|UBIGI|(^|\s)019(\s|$)|פרטנר|סלקום|פלאפון|הוט מובייל|גולן טלקום/;
const RE_FEE = /דמי כרטיס|עמלת/;
const RE_ONLINE = /AMAZON|AMZN|ALIEXPRESS|TEMU|SHEIN|EBAY|IHERB/;
const RE_BIT = /(^|\s)BIT(\s|$)|PAYBOX|פייבוקס/;

function parseDate(v) {
  if (v == null || v === '') return null;
  let y, m, d;
  if (v instanceof Date) { const t = new Date(v.getTime() + 12 * 3600e3); y = t.getFullYear(); m = t.getMonth() + 1; d = t.getDate(); }
  else if (typeof v === 'number') { if (v < 20000 || v > 80000) return null; const t = new Date(Date.UTC(1899, 11, 30) + v * 864e5); y = t.getUTCFullYear(); m = t.getUTCMonth() + 1; d = t.getUTCDate(); }
  else {
    const s = String(v).trim();
    let k = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (k) { y = +k[1]; m = +k[2]; d = +k[3]; }
    else { k = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/); if (!k) return null; d = +k[1]; m = +k[2]; y = +k[3]; if (y < 100) y += 2000; }
  }
  if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31 && y > 2000)) return null;
  return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
}
function parseAmount(v) {
  if (typeof v === 'number') return v;
  if (v == null) return NaN;
  const s = String(v).replace(/[^\d.,-]/g, '').replace(/,/g, '');
  return s ? parseFloat(s) : NaN;
}
function parseSheet(rows, sheetName) {
  let h = -1;
  for (let i = 0; i < Math.min(rows.length, 40); i++) {
    const c = (rows[i] || []).map((x) => String(x == null ? '' : x));
    if (c.some((x) => /תאריך/.test(x)) && c.some((x) => /סכום/.test(x))) { h = i; break; }
  }
  if (h < 0) return [];
  const head = rows[h].map((x) => String(x == null ? '' : x).trim());
  const col = (res) => { for (const re of res) { const i = head.findIndex((x) => re.test(x)); if (i >= 0) return i; } return -1; };
  const cDate = col([/תאריך עסקה/, /תאריך רכישה/, /תאריך/]);
  const cName = col([/שם בית.?העסק/, /בית.?עסק/, /תיאור/, /פרטים/]);
  const cAmt = col([/סכום חיוב/, /סכום לחיוב/, /סכום/]);
  const cCat = col([/קטגוריה/, /ענף/]);
  const cCard = col([/4 ספרות/, /כרטיס/]);
  const cCur = col([/מטבע עסקה מקורי/, /מטבע מקור/]);
  const cNote = col([/הערות/, /פירוט נוסף/]);
  if (cDate < 0 || cName < 0 || cAmt < 0) return [];
  const abroad = /חו["״']ל|מט["״']ח/.test(sheetName);
  const out = [];
  for (let i = h + 1; i < rows.length; i++) {
    const r = rows[i] || [];
    const date = parseDate(r[cDate]), amount = parseAmount(r[cAmt]);
    const merchant = String(r[cName] == null ? '' : r[cName]).replace(/\s+/g, ' ').trim();
    if (!date || !merchant || isNaN(amount)) continue;
    const t = { date, month: date.slice(0, 7), merchant, amount, abroad,
      rawCat: cCat >= 0 && r[cCat] ? String(r[cCat]).trim() : '', card: cCard >= 0 && r[cCard] != null ? String(r[cCard]).replace(/\.0$/, '') : '',
      cur: cCur >= 0 && r[cCur] ? String(r[cCur]).trim() : '', note: cNote >= 0 && r[cNote] ? String(r[cNote]) : '' };
    t.category = categorize(t);
    out.push(t);
  }
  return out;
}
function categorize(t) {
  const m = t.merchant.toUpperCase();
  if (RE_BIT.test(m)) return 'העברות BIT';
  if (RE_ONLINE.test(m)) return 'קניות אונליין';
  if (RE_SUBS.test(m)) return 'מנויים ותקשורת';
  if (RE_FEE.test(m)) return 'עמלות';
  if (t.abroad && t.cur && !/₪|ILS|NIS|ש["״]ח/.test(t.cur)) return 'נסיעות לחו״ל';
  return CAT_MAP[t.rawCat] || t.rawCat || 'שונות';
}
const cleanName = (n) => n.replace(/^PAYPAL \*/, '').replace(/\s+[\d-]{6,}.*$/, '').replace(/\s+[A-Z]{2}$/, '');

function analyze(tx, notRecurring) {
  const months = Array.from(new Set(tx.map((t) => t.month))).sort();
  const n = months.length || 1;
  const total = sum(tx, (t) => t.amount);
  const byMonth = months.map((m) => { const v = tx.filter((t) => t.month === m); return { month: m, amount: sum(v, (t) => t.amount), count: v.length }; });
  const cats = {};
  tx.forEach((t) => { (cats[t.category] = cats[t.category] || []).push(t); });
  const byCat = Object.keys(cats).map((c) => { const a = sum(cats[c], (t) => t.amount); return { category: c, amount: a, avg: a / n, share: total ? Math.round(a / total * 100) : 0, tx: cats[c].slice().sort((x, y) => y.amount - x.amount) }; }).sort((a, b) => b.amount - a.amount);

  const groups = {};
  tx.filter((t) => t.amount > 0 && t.category !== 'העברות BIT').forEach((t) => { (groups[t.merchant] = groups[t.merchant] || []).push(t); });
  const subs = [];
  Object.keys(groups).forEach((name) => {
    if (notRecurring.has(name)) return;
    const g = groups[name], ms = new Set(g.map((t) => t.month)).size;
    const am = g.map((t) => t.amount).sort((a, b) => a - b), med = am[Math.floor(am.length / 2)];
    const steady = am.every((a) => Math.abs(a - med) <= med * 0.1);
    const known = RE_SUBS.test(name.toUpperCase()) || RE_FEE.test(name);
    const monthly = steady && g.length <= ms + 1 && (ms >= 3 || (known && ms >= 2));
    if (!monthly && !known) return;
    const avg = sum(g, (t) => t.amount) / g.length;
    subs.push({ key: name, name: cleanName(name), fee: RE_FEE.test(name), monthly, avg, yearly: monthly ? avg * 12 : null, card: g[g.length - 1].card });
  });
  subs.sort((a, b) => (b.yearly || 0) - (a.yearly || 0));
  const subYear = sum(subs, (s) => s.yearly || 0);

  const dups = [], dg = {};
  tx.filter((t) => t.amount >= 20 && t.category !== 'העברות BIT').forEach((t) => { const k = t.merchant + '|' + t.amount; (dg[k] = dg[k] || []).push(t); });
  Object.keys(dg).forEach((k) => {
    const g = dg[k].slice().sort((a, b) => a.date.localeCompare(b.date));
    if (g.length < 2) return;
    let close = false;
    for (let i = 1; i < g.length; i++) if ((new Date(g[i].date) - new Date(g[i - 1].date)) / 864e5 <= 3) close = true;
    if (!close) return;
    const refunded = tx.some((t) => t.amount === -g[0].amount);
    dups.push({ merchant: cleanName(g[0].merchant), amount: g[0].amount, times: g.length, dates: g.map((t) => t.date.slice(8) + '/' + t.date.slice(5, 7)).join(', '),
      verdict: refunded ? 'נמצא זיכוי תואם' : g[0].amount < 20 ? 'כנראה רכישות נפרדות' : 'כדאי לבדוק', flag: !refunded && g[0].amount >= 20 });
  });
  dups.sort((a, b) => b.amount - a.amount);

  const sav = [];
  subs.filter((s) => s.fee && s.monthly).forEach((s) => sav.push({ title: 'לבטל דמי כרטיס' + (s.card ? ' (' + s.card + ')' : ''), detail: ils2(s.avg) + ' בחודש – אפשר לבקש פטור מחברת האשראי', yearly: s.yearly, effort: 'קל' }));
  subs.filter((s) => !s.fee && s.monthly && s.avg >= 40).slice(0, 3).forEach((s) => sav.push({ title: 'לבדוק את ' + s.name, detail: ils(s.avg) + ' בחודש – עדיין בשימוש?', yearly: s.yearly, effort: 'קל' }));
  const ilsAbroad = sum(tx.filter((t) => t.amount > 0 && /חו["״]ל בש["״]ח/.test(t.note)), (t) => t.amount);
  if (ilsAbroad > 0) sav.push({ title: 'לשלם בדולרים באתרים זרים', detail: 'חיוב בשקלים באתר זר יקר בדרך כלל ב-2–4%', yearly: ilsAbroad / n * 12 * 0.03, effort: 'קל' });
  const rest = byCat.find((c) => c.category === 'מסעדות וקפה');
  if (rest && rest.avg > 200) sav.push({ title: 'להוריד 20% במסעדות ובקפה', detail: 'היום ' + ils(rest.avg) + ' בחודש בממוצע', yearly: rest.avg * 0.2 * 12, effort: 'בינוני' });
  const fuel = sum(tx.filter((t) => /דלק/.test(t.rawCat) && t.amount > 0), (t) => t.amount);
  if (fuel > 0) sav.push({ title: 'הנחת דלק במועדון או באפליקציה', detail: ils(fuel) + ' על דלק בתקופה', yearly: null, effort: 'קל' });
  subs.filter((s) => !s.monthly).slice(0, 2).forEach((s) => sav.push({ title: 'לבדוק את ' + s.name, detail: 'חיוב של ' + ils(s.avg) + ' – לוודא שעדיין נחוץ', yearly: null, effort: 'קל' }));
  const savYear = sum(sav, (s) => s.yearly || 0);
  return { months, n, total, avg: total / n, byMonth, byCat, subs, subYear, dups, sav, savYear };
}

function bar(name, value, share, max, amount) {
  const row = el('div', 'row'), line = el('div', 'line'), left = el('span', '', name + ' ');
  if (share != null) left.append(el('small', '', share + '%'));
  line.append(left, el('b', '', value));
  const track = el('div', 'track'), fill = el('div', 'fill');
  fill.style.width = Math.max(2, Math.min(100, Math.round(amount / max * 100))) + '%';
  track.append(fill); row.append(line, track);
  return row;
}
// A row with a title and an amount; the explanation opens only when "פירוט" is tapped.
function foldItem(title, value, cls, detail) {
  const row = el('div', 'item'), left = el('div'), more = el('small', 'more', detail), btn = el('button', 'x', 'פירוט');
  btn.type = 'button';
  more.hidden = true;
  btn.addEventListener('click', () => { more.hidden = !more.hidden; btn.textContent = more.hidden ? 'פירוט' : 'הסתרה'; });
  left.append(el('strong', '', title), btn, more);
  row.append(left, el('b', cls || '', value));
  return row;
}
function item(title, sub, value, cls) {
  const row = el('div', 'item'), left = el('div');
  left.append(el('strong', '', title), el('small', '', sub));
  row.append(left, el('b', cls || '', value));
  return row;
}

let TX = [];
const notRecurring = new Set();
function render() {
  const a = analyze(TX, notRecurring);
  const first = a.months[0], last = a.months[a.months.length - 1];
  $('period').textContent = (first === last ? ml(first) : ml(first) + '–' + ml(last)) + ' ' + last.slice(0, 4) + ' · ' + TX.length + ' עסקאות';
  $('avg').textContent = ils(a.avg);
  const lm = a.byMonth[a.byMonth.length - 1], ll = $('lastline');
  ll.replaceChildren();
  if (a.n > 1) {
    const p = Math.round((lm.amount / a.avg - 1) * 100);
    ll.append(ml(lm.month) + ': ', el('b', '', ils(lm.amount)), ' · ', el('span', p <= 0 ? 'ok' : 'bad', (p > 0 ? '+' : '') + p + '%'), ' מול הממוצע');
  }

  // Monthly chart: fixed-width columns that scroll sideways, newest month selected. Tap a month to see its total.
  const SHORT = ['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];
  const max = Math.max.apply(null, a.byMonth.map((m) => m.amount)) || 1;
  const cols = $('cols');
  cols.replaceChildren();
  const pick = (m, node) => {
    Array.from(cols.children).forEach((c) => c.classList.remove('sel'));
    node.classList.add('sel');
    $('pick').replaceChildren(MONTHS[+m.month.slice(5, 7) - 1] + ' ' + m.month.slice(0, 4) + ' · ', el('b', '', ils(m.amount)), ' · ' + m.count + ' עסקאות');
  };
  let lastCol = null;
  a.byMonth.forEach((m, i) => {
    const c = el('button', 'c2' + (m.amount > a.avg ? ' hi' : '')), bw = el('span', 'bw'), b = el('i');
    c.type = 'button';
    b.style.height = Math.max(4, Math.round(m.amount / max * 120)) + 'px';
    bw.append(b);
    const mo = +m.month.slice(5, 7);
    const label = el('span', 'ml', SHORT[mo - 1]);
    if (i === 0 || mo === 1) { label.append(document.createElement('br'), '’' + m.month.slice(2, 4)); }
    c.append(bw, label);
    c.addEventListener('click', () => pick(m, c));
    cols.append(c);
    lastCol = c;
  });
  const avgLine = el('div', 'avgline');
  avgLine.style.bottom = (36 + Math.round(a.avg / max * 120)) + 'px';
  cols.append(avgLine);
  if (lastCol) pick(a.byMonth[a.byMonth.length - 1], lastCol);
  const chart = $('chart');
  chart.scrollLeft = -chart.scrollWidth; // RTL: newest month is on the left end

  const top = a.byCat[0] ? a.byCat[0].amount : 1;
  $('top4').replaceChildren.apply($('top4'), a.byCat.slice(0, 4).map((c) => bar(c.category, ils(c.amount), null, top, c.amount)));
  $('save1').textContent = $('save2').textContent = ils(a.savYear);

  $('totlbl').textContent = 'סה״כ ב-' + a.n + (a.n === 1 ? ' חודש' : ' חודשים');
  $('total').textContent = ils(a.total);
  $('cats').replaceChildren();
  a.byCat.forEach((c) => {
    const det = el('details'), s = el('summary');
    s.append.apply(s, Array.from(bar(c.category, ils(c.avg) + ' לחודש', c.share, top, c.amount).children));
    det.append(s);
    c.tx.forEach((t) => {
      const line = el('div', 'tx'), name = el('span', '', t.merchant + ' ');
      name.append(el('small', '', t.date.slice(8) + '/' + t.date.slice(5, 7)));
      line.append(name, el('b', '', ils(t.amount)));
      det.append(line);
    });
    $('cats').append(det);
  });

  $('submonth').textContent = ils(a.subYear / 12);
  $('subyear').textContent = ils(a.subYear) + ' בשנה';
  $('sublist').replaceChildren();
  if (!a.subs.length) $('sublist').append(el('div', 'sub mut', 'לא זוהו חיובים קבועים'));
  a.subs.forEach((s) => {
    const row = item(s.name, (s.fee ? 'עמלה' : 'מנוי') + (s.card ? ' · כרטיס ' + s.card : '') + (s.monthly ? ' · ' + ils(s.yearly) + ' בשנה' : ' · חיוב אחד בתקופה'), ils(s.avg) + (s.monthly ? ' לחודש' : ''));
    const x = el('button', 'x', 'זה לא חיוב קבוע');
    x.type = 'button';
    x.addEventListener('click', () => { notRecurring.add(s.key); save(); render(); });
    row.firstChild.append(x);
    $('sublist').append(row);
  });

  $('savlist').replaceChildren();
  if (!a.sav.length) $('savlist').append(el('div', 'sub mut', 'לא נמצאו המלצות בנתונים האלה'));
  a.sav.forEach((s) => {
    $('savlist').append(foldItem(s.title, s.yearly == null ? 'לבדוק' : ils(s.yearly), s.yearly == null ? 'mut' : 'ok', s.detail + ' · ' + s.effort));
  });
  $('duplist').replaceChildren();
  const toCheck = a.dups.filter((d) => d.flag).length;
  $('duptitle').textContent = 'חיובים כפולים' + (a.dups.length ? ' · ' + (toCheck ? toCheck + ' לבדיקה' : a.dups.length) : '');
  if (!a.dups.length) $('duplist').append(el('div', 'sub mut', 'לא נמצאו'));
  a.dups.forEach((d) => $('duplist').append(foldItem(d.merchant, d.times + ' × ' + ils2(d.amount), d.flag ? 'bad' : '', d.dates + ' · ' + d.verdict)));
}

function openTab(id) {
  document.querySelectorAll('.sec').forEach((s) => { s.hidden = s.id !== id; });
  document.querySelectorAll('.tab').forEach((b) => { b.setAttribute('aria-pressed', b.dataset.tab === id ? 'true' : 'false'); });
  window.scrollTo(0, 0);
}
document.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => openTab(b.dataset.tab)));

const STORE = 'finance-tx-v1', STORE_NR = 'finance-notrec-v1';
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(TX)); localStorage.setItem(STORE_NR, JSON.stringify(Array.from(notRecurring))); } catch (e) {}
}
let infoTimer = null;
function fail(msg) {
  const box = $('app').hidden ? $('err') : $('err2');
  box.textContent = msg; box.hidden = false;
  if (box.id === 'err2') { clearTimeout(infoTimer); infoTimer = setTimeout(() => { box.hidden = true; }, 4000); }
}
function showApp() {
  $('err').hidden = true; $('start').hidden = true; $('app').hidden = false;
  openTab('overview'); render();
}
// Adds new transactions to the saved ones. A transaction already saved (same date, business, amount and card)
// is not added again, so uploading an overlapping file twice does not double it.
function merge(tx) {
  const key = (t) => [t.date, t.merchant, t.amount, t.card].join('|');
  const have = {};
  TX.forEach((t) => { have[key(t)] = (have[key(t)] || 0) + 1; });
  const seen = {}, added = [];
  tx.forEach((t) => { const k = key(t); seen[k] = (seen[k] || 0) + 1; if (seen[k] > (have[k] || 0)) added.push(t); });
  TX = TX.concat(added);
  return added.length;
}
function loadBuffers(buffers) {
  if (typeof XLSX === 'undefined') { fail('אין חיבור לאינטרנט. נסו שוב.'); return; }
  let tx = [];
  try {
    buffers.forEach((buf) => {
      const wb = XLSX.read(buf, { type: 'array', cellDates: true });
      wb.SheetNames.forEach((name) => { tx = tx.concat(parseSheet(XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null }), name)); });
    });
  } catch (e) { fail('לא הצלחתי לפתוח את הקובץ.'); return; }
  if (!tx.length) { fail('לא נמצאו עסקאות בקובץ.'); return; }
  const wasEmpty = !TX.length;
  const added = merge(tx);
  save();
  showApp();
  if (!wasEmpty) fail(added ? 'נוספו ' + added + ' עסקאות.' : 'כל העסקאות בקובץ כבר קיימות.');
}
window.loadBuffers = loadBuffers;
function handle(files) {
  const list = Array.from(files || []);
  if (!list.length) return;
  $('err2').hidden = true;
  Promise.all(list.map((f) => f.arrayBuffer())).then(loadBuffers).catch(() => fail('לא הצלחתי לקרוא את הקובץ.'));
}
['file', 'file2'].forEach((id) => $(id).addEventListener('change', (e) => { handle(e.target.files); e.target.value = ''; }));
const drop = $('drop');
['dragenter', 'dragover'].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (e) => handle(e.dataTransfer.files));
$('reset').addEventListener('click', () => {
  if (!confirm('למחוק את כל הנתונים השמורים?')) return;
  TX = []; notRecurring.clear();
  try { localStorage.removeItem(STORE); localStorage.removeItem(STORE_NR); } catch (e) {}
  $('err2').hidden = true; $('app').hidden = true; $('start').hidden = false; window.scrollTo(0, 0);
});

// Restore what was uploaded before.
try {
  const saved = JSON.parse(localStorage.getItem(STORE) || '[]');
  JSON.parse(localStorage.getItem(STORE_NR) || '[]').forEach((k) => notRecurring.add(k));
  if (Array.isArray(saved) && saved.length) { TX = saved; showApp(); }
} catch (e) {}

// Home-screen app: offline support and an install button where the browser allows it.
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((r) => r.update()).catch(() => {});
}
let installEvt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; $('install').hidden = false; });
$('install').addEventListener('click', () => { if (!installEvt) return; installEvt.prompt(); installEvt = null; $('install').hidden = true; });
</script>
